name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for wadiwala.net
        run: npm run build

      # Porkbun static hosting (GitHub Connect) serves this branch exactly as committed.
      - name: Publish to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy ${{ github.sha }}

      # Without a custom domain, GitHub Pages serves the site under /<repo>/, which needs its own build.
      - name: Check for a Pages custom domain
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""' 2>/dev/null || true)
          if [ -n "$cname" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            owner="${{ github.repository_owner }}"
            repo="${{ github.event.repository.name }}"
            echo "base=/$repo" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner,,}.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for the github.io preview
        if: steps.pages.outputs.base != ''
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.url }}
          NEXT_PUBLIC_NOINDEX: "1"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
